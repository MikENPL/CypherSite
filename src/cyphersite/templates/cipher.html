<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Cypher</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../static/css/style.css">
    </head>
    <body>
        <h1>{{ title }}</h1>
        <div class="functions">
            <select id="function-select">
                {% for func_name, arguments in forms.items() %}
                    <option value="{{ func_name }}">{{ func_name.replace("_", " ").title() }}</option>
                {% endfor %}
            </select>
            {% for func_name, arguments in forms.items() %}
                <form class="function" id="{{ func_name }}" method="POST" action="/{{ cipher_name }}/{{ func_name }}">
                {% for argument, type in arguments %}
                <div class="form-group">    
                    {% if type == "str" %}
                    <label>{{ argument.replace("_", " ").title() }}</label>
                    <input type="text" name="{{ argument }}">
                    {% elif type == "int" %}
                    <label>{{ argument.replace("_", " ").title() }}</label>
                    <input type="number" name="{{ argument }}">
                    {% elif type == "bool" %}
                    <label>{{ argument.replace("_", " ").title() }}</label>
                    <input type="checkbox" name="{{ argument }}">
                    {% else %}
                    <label>{{ argument.replace("_", " ").title() }}</label>
                    <input type="text" name="{{ argument }}">
                    {% endif %}
                </div>
                {% endfor %}
                    <button class="button">Submit</button>
                </form>
            {% endfor %}
        </div>
        <div id="results">
            <p><span id="result"></span><span id="result_highlight"></span></p>
        </div>
        <script src="../static/js/main.js" async defer></script>
    </body>
</html>
