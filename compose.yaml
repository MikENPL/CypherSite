services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-app
    ports:
      - "8000:8000"
    restart: unless-stopped
    command:
      - uv
      - run
      - uvicorn
      - cyphersite.main:app
      - --app-dir
      - src
      - --host
      - 0.0.0.0
      - --port
      - "8000"